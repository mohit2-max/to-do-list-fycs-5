<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ===========================================================
   1. THEME TOKENS (CSS variables) — light & dark
   =========================================================== */
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-2: #f4eee5;
  --text: #2f2a26;
  --muted: #8a8079;
  --border: #ece4d9;
  --accent: #e07a5f;        /* warm terracotta */
  --accent-soft: #fbe3da;
  --sage: #9cb59a;   --sage-soft: #e5efe3;
  --sky: #8fb3d9;    --sky-soft: #e2ecf7;
  --butter: #e9c46a; --butter-soft: #faf0d4;
  --lilac: #b8a1d6;  --lilac-soft: #eee6f7;
  --danger: #d9534f;
  --shadow: 0 1px 2px rgba(60,40,20,.04), 0 8px 24px -12px rgba(60,40,20,.12);
  --radius: 14px;
}
body.dark {
  --bg: #1b1917;
  --surface: #242120;
  --surface-2: #2d2927;
  --text: #f1ebe4;
  --muted: #a39890;
  --border: #36312e;
  --accent-soft: #4a2f27;
  --sage-soft: #2c3a2b;
  --sky-soft: #26323f;
  --butter-soft: #3d3522;
  --lilac-soft: #352d40;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

/* ===========================================================
   2. BASE
   =========================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Nunito Sans", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
  min-height: 100vh;
}
h1, h2, h3, .serif { font-family: "Fraunces", Georgia, serif; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

/* ===========================================================
   3. LAYOUT — 3 columns
   =========================================================== */
.app {
  display: grid;
  grid-template-columns: 250px 1fr 300px;
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ---------- Sidebar ---------- */
.sidebar { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 24px; height: calc(100vh - 48px); }
.brand { font-family: "Fraunces", serif; font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }
.brand span { color: var(--accent); }
.profile { display: flex; gap: 12px; align-items: center; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700;
}
.profile small { color: var(--muted); display: block; font-size: .78rem; }
.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; padding-left: 10px; }
.nav-item {
  width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: .92rem; transition: background .2s;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-item .count { font-size: .75rem; color: var(--muted); }
.tag-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: .9rem; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.theme-toggle {
  margin-top: auto; padding: 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s;
}
.theme-toggle:hover { background: var(--surface-2); }

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.banner {
  background: linear-gradient(120deg, var(--accent-soft), var(--butter-soft));
  border-radius: var(--radius); padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.banner strong { font-family: "Fraunces", serif; font-size: 1.05rem; }
.banner p { font-size: .85rem; color: var(--muted); }
.chip {
  background: var(--surface); color: var(--accent);
  padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 2.1rem; }
.header p { color: var(--muted); margin-top: 4px; }

.add-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; }
.add-bar input[type=text] { flex: 1; min-width: 180px; border: none; outline: none; background: transparent; padding: 8px 10px; font-size: 1rem; }
.add-bar select {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 10px; padding: 8px 10px; outline: none;
}
.btn {
  background: var(--accent); color: #fff; padding: 9px 18px; border-radius: 10px; font-weight: 700;
  transition: transform .15s, opacity .2s;
}
.btn:hover { opacity: .92; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface-2); color: var(--text); }

.task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.task {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px;
  animation: slideIn .3s ease;
  transition: opacity .3s, transform .3s, background .3s;
  flex-wrap: wrap;
}
.task.removing { opacity: 0; transform: translateX(20px); }
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* Circular checkbox */
.check {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--muted); display: grid; place-items: center;
  transition: all .2s;
}
.check:hover { border-color: var(--accent); }
.task.done .check { background: var(--sage); border-color: var(--sage); }
.check svg { opacity: 0; transition: opacity .2s; }
.task.done .check svg { opacity: 1; }

/* Strikethrough animation */
.task-text { 
  flex: 1 1 200px; 
  min-width: 160px;
  position: relative; 
  word-break: normal;
  overflow-wrap: break-word; 
  line-height: 1.4;
  transition: color .3s; 
}
.task-text::after {
  content: ""; position: absolute; left: 0; top: 50%; height: 1.5px; width: 0;
  background: var(--muted); transition: width .35s ease;
}
.task.done .task-text { color: var(--muted); }
.task.done .task-text::after { width: 100%; }

.pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
.p1 { background: var(--accent-soft); color: var(--accent); }
.p2 { background: var(--sky-soft); color: var(--sky); }
.cat-academic { background: var(--lilac-soft); color: var(--lilac); }
.cat-practicals { background: var(--sage-soft); color: var(--sage); }
.cat-cf { background: var(--accent-soft); color: var(--accent); }
.cat-python { background: var(--sky-soft); color: var(--sky); }
.cat-lab { background: var(--sage-soft); color: var(--sage); }
.cat-aec { background: var(--lilac-soft); color: var(--lilac); }
.cat-personal { background: var(--butter-soft); color: #b8912f; }
.trash { color: var(--muted); padding: 4px; border-radius: 8px; opacity: .6; transition: all .2s; margin-left: auto; flex-shrink: 0; }
.trash:hover { color: var(--danger); opacity: 1; background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* ---------- Right column ---------- */
.aside { display: flex; flex-direction: column; gap: 20px; }
.aside h3 { font-size: 1.05rem; margin-bottom: 12px; }
.timer { font-family: "Fraunces", serif; font-size: 3.4rem; text-align: center; letter-spacing: .02em; margin: 6px 0 4px; }
.timer-label { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
.timer-btns { display: flex; gap: 8px; justify-content: center; }
.ring-track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.ring-fill { height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }
.progress-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--sage), var(--accent)); border-radius: 99px; transition: width .5s ease; }
.progress-meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 8px; }
.big-pct { font-family: "Fraunces", serif; font-size: 2rem; }
.tip { background: var(--sage-soft); border-color: transparent; }
.tip p { font-size: .92rem; line-height: 1.55; }
.tip small { display: block; margin-top: 10px; color: var(--muted); }

/* ---------- Marks & SGPA ---------- */
.gpa h2 { font-size: 1.4rem; margin-bottom: 4px; }
.gpa .sub { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
.tbl-wrap { overflow-x: auto; }
table.marks { width: 100%; border-collapse: collapse; font-size: .88rem; }
.marks th { text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; padding: 8px 6px; border-bottom: 1px solid var(--border); }
.marks td { padding: 7px 6px; border-bottom: 1px solid var(--border); }
.marks input { width: 64px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); outline: none; }
.marks input:focus { border-color: var(--accent); }
.marks .type { font-size: .7rem; color: var(--muted); }
.result-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.result { flex: 1; min-width: 140px; background: var(--surface-2); border-radius: 12px; padding: 14px; }
.result small { color: var(--muted); display: block; font-size: .78rem; }
.result b { font-family: "Fraunces", serif; font-size: 1.7rem; }
.fail { color: var(--danger); font-weight: 700; }
.grade-scales { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

/* ---------- Timetable ---------- */
table.tt { width: 100%; border-collapse: collapse; font-size: .8rem; table-layout: fixed; min-width: 560px; }
.ex-done { opacity: .5; text-decoration: line-through; }
.ex-today td { background: var(--accent-soft); font-weight: 700; }
.ex-next td { background: var(--butter-soft); }
.tt th, .tt td { border: 1px solid var(--border); padding: 7px 5px; text-align: center; vertical-align: middle; }
.tt th { background: var(--surface-2); font-weight: 700; }
.tt td.time

.result b { font-family: "Fraunces", serif; font-size: 1.7rem; }
.fail { color: var(--danger); font-weight: 700; }
.grade-scales { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

/* ---------- Timetable ---------- */
table.tt { width: 100%; border-collapse: collapse; font-size: .8rem; table-layout: fixed; min-width: 560px; }
.ex-done { opacity: .5; text-decoration: line-through; }
.ex-today td { background: var(--accent-soft); font-weight: 700; }
.ex-next td { background: var(--butter-soft); }
.tt th, .tt td { border: 1px solid var(--border); padding: 7px 5px; text-align: center; vertical-align: middle; }
.tt th { background: var(--surface-2); font-weight: 700; }
